<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f766e" />
    <title>Atendimento</title>
    <script>
      // Último nome da empresa conhecido (mesma chave de src/web/workspace.ts): evita piscar o padrão na aba.
      try {
        var n = localStorage.getItem("crm.company-name");
        if (n && n.trim()) document.title = n.trim();
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/web/main.tsx"></script>
  </body>
</html>
